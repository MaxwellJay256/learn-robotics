<div class="quiz">
      <div class="q" data-q="1">
        <div class="qhead"><span class="qn">Q1</span><span class="qt">某旋转矩阵满足 \(\operatorname{tr}R = 0\)。它的转角 \(\theta\) 是？</span></div>
        <div class="opts">
          <label class="opt"><span class="tick"><input type="radio" name="q1"></span>\(90^\circ\)</label>
          <label class="opt"><span class="tick"><input type="radio" name="q1"></span>\(120^\circ\)</label>
          <label class="opt"><span class="tick"><input type="radio" name="q1"></span>\(180^\circ\)</label>
        </div>
        <div class="explain" data-for="1"></div>
      </div>

      <div class="q" data-q="2">
        <div class="qhead"><span class="qn">Q2</span><span class="qt">已知 \(\theta = \pi\)。从 \(R\) 恢复 \(\omega\) 应当用哪条路线？</span></div>
        <div class="opts">
          <label class="opt"><span class="tick"><input type="radio" name="q2"></span>\(\hat{\omega} = \dfrac{R - R^{\mathsf{T}}}{2\sin\theta}\)</label>
          <label class="opt"><span class="tick"><input type="radio" name="q2"></span>\(R + I = 2\omega\omega^{\mathsf{T}}\)，从对称部分读出 \(\omega\)</label>
          <label class="opt"><span class="tick"><input type="radio" name="q2"></span>对 \(R\) 的每一列分别求 \(\arccos\)</label>
        </div>
        <div class="explain" data-for="2"></div>
      </div>

      <div class="q" data-q="3">
        <div class="qhead"><span class="qn">Q3</span><span class="qt">同一个旋转矩阵 \(R\)，指数坐标 \((\omega,\theta)\) 唯一吗？</span></div>
        <div class="opts">
          <label class="opt"><span class="tick"><input type="radio" name="q3"></span>唯一</label>
          <label class="opt"><span class="tick"><input type="radio" name="q3"></span>不唯一：\(\theta\) 可加 \(2\pi k\)；\((-\omega,-\theta)\) 也给出同一个 \(R\)</label>
          <label class="opt"><span class="tick"><input type="radio" name="q3"></span>不唯一：\(\omega\) 的方向可以任取</label>
        </div>
        <div class="explain" data-for="3"></div>
      </div>
