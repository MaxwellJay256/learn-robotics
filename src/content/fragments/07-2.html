<div class="work">
  <div>
    <div class="canvasbox">
      <canvas id="cv2" width="860" height="520"></canvas>
      <div class="cap"><span>子问题 2 · 两个圆的交点就是中间点 z</span><span class="hint">滑块 = 转两个角　拖空白 = 平移</span></div>
    </div>
    <div class="toolbar">
      <span class="tlabel">θ₂（绕 x 轴）</span>
      <input class="range" id="s2t2" type="range" min="0" max="180" step="1" value="0">
      <b class="val" id="s2t2v">0°</b>
      <span class="tlabel">θ₁（绕 z 轴）</span>
      <input class="range" id="s2t1" type="range" min="-180" max="180" step="1" value="0">
      <b class="val" id="s2t1v">0°</b>
      <button id="s2sol1">解 1：θ₂=45°，θ₁=90°</button>
      <button id="s2sol2">解 2：θ₂=135°，θ₁=−90°</button>
      <button id="s2reset">重置</button>
    </div>
  </div>
  <div class="panel">
    <div class="pblock">
      <div class="plabel"><span>中间点落在两个交点之一</span><span class="val" id="s2zOut">z</span></div>
      <div class="eq"><span class="mathout" id="s2z"></span></div>
      <p class="note">蓝点 \(c\) 是 \(p\) 绕 \(x\) 轴转 \(\theta_2\) 后的位置，红点是 \(c\) 再绕 \(z\) 轴转 \(\theta_1\) 后的位置；两个空心圆点是两圆的交点 \(z_+\)、\(z_-\)。</p>
    </div>
    <div class="pblock">
      <div class="plabel"><span>中间点的分解</span><span class="val" id="s2abgOut">α β γ</span></div>
      <div class="eq"><span class="mathout" id="s2abg"></span></div>
      <p class="note" id="s2note">—</p>
    </div>
  </div>
</div>
